<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Notto — Android native bridge shim.
   In a normal browser window.NottoBridge is undefined and this is a no-op.
   On Android it routes file exports (PNG/PDF/TXT) to the native layer so
   "download" actually saves a file, since WebView cannot download blob: URLs. */
(function () {
  var NB = window.NottoBridge;
  if (!NB) return;
  document.documentElement.setAttribute('data-android', '1');
  document.addEventListener('click', function (e) {
    var t = e.target, a = (t && t.closest) ? t.closest('a[download]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.slice(0, 5) !== 'blob:' && href.slice(0, 5) !== 'data:') return;
    e.preventDefault(); e.stopImmediatePropagation();
    var name = a.getAttribute('download') || 'notto-export';
    fetch(href).then(function (r) { return r.blob(); }).then(function (b) {
      var fr = new FileReader();
      fr.onload = function () { try { NB.saveFile(name, String(fr.result)); } catch (err) {} };
      fr.readAsDataURL(b);
    }).catch(function () {});
  }, true);
})();
</script>

<style>
:root{--bg:#dcdcdf;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.64,1);--cream:#f5edc2;--ink:#121212;--or:#ee7a4b;--ye:#f6cf3d;--gr:#92d35c;--bl:#8fb9ea;--hl:#ffd84a;
box-sizing:border-box;font-family:Montserrat,"Avenir Next","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a1c}}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#app{position:relative;margin:0 auto;height:100%;max-width:430px;background:#0b0b0b;color:#fff;overflow:hidden;overflow:clip;contain:layout paint}
@media (min-width:520px){#app{height:min(100%,880px);margin-top:max(0px,calc((100% - 880px)/2));border-radius:44px}}
.v{position:absolute;inset:0;overflow:clip}
/* list */
.list{background:#0b0b0b radial-gradient(circle,#1b1b1b 1px,transparent 1.3px) 0 0/9px 9px;transition:transform .6s var(--ease),opacity .45s var(--ease)}
.ed .list{transform:scale(.94);opacity:.4}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 150px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px}
.brand{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8a;display:flex;align-items:center;gap:8px;margin-top:6px}
.brand b{width:14px;height:14px;border-radius:5px 5px 5px 0;background:var(--ye);display:block}
h1.big{font-size:56px;line-height:1;font-weight:500;letter-spacing:-2px;margin:18px 4px 22px}
.rb{width:44px;height:44px;border-radius:50%;background:#1d1d1d;display:grid;place-items:center;color:#cfcfcf;transition:transform .2s var(--ease)}
.rb:active{transform:scale(.9)}
.chips{display:flex;gap:10px;padding:0 2px 18px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:42px;padding:0 18px;border:1px solid #2c2c2c;border-radius:21px;color:#9a9a9a;font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;transition:background .3s,color .3s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:#171717;color:#fff;border-color:#454545}

<script>
(()=>{

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=36e5,now=Date.now();
const seed=[
 {id:1,type:'todo',c:'or',title:'Plan for The Day',items:[{t:'Buy food',d:1},{t:'GYM',d:0},{t:'Invest',d:0}],fav:0,t:now-H},
 {id:2,type:'img',c:'ye',title:'Image Notes',html:'',fav:0,t:now-2*H},
 {id:3,type:'note',c:'cr',title:'Design Sprint Lecture',meta:'5 Notes',html:'<p><b>Design Sprint</b> is a way to quickly ideate, prototype, and validate a product idea in a week instead of waiting for months to launch a full-fledged product.</p><p><b>Design Sprint Phases:</b></p><p>Understand, define, sketch, decide, prototype, test.</p>',fav:0,t:now-3*H},
 {id:4,type:'note',c:'gr',title:'List of Books',html:'<p>Things I want to read this season.</p>',fav:0,t:now-26*H},
 {id:5,type:'note',c:'bl',title:'Image Moodboard',html:'<p>Warm light, soft grain, big type.</p>',fav:1,t:now-50*H}];
let S={n:seed,f:'all',id:null};
try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.length)S.n=r}catch(e){}
const DB=new Promise(ok=>{try{const r=indexedDB.open('notto',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}catch(e){ok(null)}});
const kv=(m,k,v)=>DB.then(d=>d?new Promise(ok=>{const t=d.transaction('kv',m==='get'?'readonly':'readwrite'),o=t.objectStore('kv'),r=m==='get'?o.get(k):o.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok()}):null);
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>DB.then(d=>{if(d)kv('put','notes',S.n);else try{localStorage.setItem(K,JSON.stringify(S.n))}catch(e){}}),300)};
const cur=()=>S.n.find(n=>n.id===S.id);
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?'just now':m<60?m+'m ago':m<1440?(m/60|0)+'h ago':(m/1440|0)+'d ago'};
const words=n=>((n.html||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length);
const ART=`<svg class="art" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice"><rect width="100" height="120" fill="#f6cf3d"/><g fill="none" stroke="#e0a91c" stroke-width="1.2"><circle cx="62" cy="64" r="14"/><circle cx="62" cy="64" r="24"/><circle cx="62" cy="64" r="34"/><circle cx="62" cy="64" r="44"/><circle cx="62" cy="64" r="56"/></g><path d="M20 120c0-22 14-30 42-30s40 8 40 30z" fill="#241611"/><rect x="52" y="68" width="20" height="26" rx="8" fill="#8c4a2b"/><ellipse cx="62" cy="55" rx="16" ry="20" fill="#a15a35"/><path d="M45 52c0-14 8-22 18-22s16 8 15 18c-5-6-10-8-17-8s-13 4-16 12z" fill="#241611"/></svg>`;
function card(n,i){
 const im0=n.cv||n.pv;if(im0)return `<article class="card cvr ${n.type} in" style="--i:${Math.min(i,8)}" data-id="${n.id}" aria-label="${esc(n.title)}"><img src="${im0}" alt="" decoding="async">${n.pv&&!n.cv?`<div class="bt">${esc(n.title)}</div>`:''}<button class="hb ${n.fav?'on':''}" data-a="fav" aria-label="Mark important">${ic('heart')}</button></article>`;
 const hb=`<button class="hb ${n.fav?'on':''}" data-a="fav" aria-label="Mark important">${ic('heart')}</button>`;
 let b;
 if(n.type==='todo')b=`<div class="ct">${esc(n.title)}</div>${hb}<div class="rows">${n.items.slice(0,4).map((x,j)=>`<div class="row ${x.d?'d':''}"><button class="ck ${x.d?'on':''}" data-a="ck" data-j="${j}" aria-label="Toggle">${ic('check')}</button>${esc(x.t)}</div>`).join('')}</div>`;
 else if(n.type==='img')b=`<div class="imgc"><div class="t"><div class="ct">${esc(n.title)}</div><div class="cm">Updated ${ago(n.t)}</div></div>${n.cover?`<img src="${n.cover}" alt="">`:ART}${hb}</div>`;
 else if(n.c==='cr')b=`<div class="bub">${ic('note')}</div><div><div class="cm" style="margin:0 0 3px">${esc(n.meta||words(n)+' words')}</div><div class="ct" style="max-width:none">${esc(n.title)}</div></div>${hb}`;
 else b=`<div class="ct">${esc(n.title||'Untitled')}</div><div class="cm">${esc(n.meta||words(n)+' words')}</div>${hb}`;
 return `<article class="card c-${n.c} ${n.c==='cr'?'cr':''} ${n.type} in" style="--i:${Math.min(i,8)}" data-id="${n.id}">${b}</article>`;
}
function render(anim=true){
 const f=S.f,L=S.n.filter(n=>f==='all'||(f==='imp'?n.fav:n.type==='todo'));
 const g=$('#grid');g.innerHTML=L.map(card).join('')||'<p class="empty">Nothing here yet. Tap + to start a note.</p>';
 if(!anim)$$('.card',g).forEach(c=>c.classList.remove('in'));
 $('#chips').innerHTML=[['all','All'],['imp','Important'],['todo','To-do']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-k="${k}">${l}${k==='all'?`<i>${S.n.length}</i>`:''}</button>`).join('');

$('#grid').onclick=e=>{
 if(held){held=0;return}

 if(a&&a.dataset.a==='ck'){const x=n.items[a.dataset.j];x.d=x.d?0:1;a.classList.toggle('on',!!x.d);a.parentNode.classList.toggle('d',!!x.d);save();return}

/* hold menu */
let hold,held=0,hid,hp;const gd=$('#grid');
function menu(id){hid=id;const n=S.n.find(x=>x.id===id);$('#sheet').innerHTML=`<b>${esc(n.title||'Untitled')}</b><button data-m="fav">${ic('heart')}${n.fav?'Remove from Important':'Mark important'}</button><button data-m="cov">${ic('photo')}Customize cover</button>${n.cv?`<button data-m="rst">${ic('sketch')}Reset cover</button>`:''}<button data-m="dup">${ic('copy')}Duplicate</button><button data-m="del" class="dg">${ic('trash')}Delete</button>`;app.classList.add('mn')}
gd.addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c)return;held=0;hp=[e.clientX,e.clientY];hold=setTimeout(()=>{held=1;navigator.vibrate&&navigator.vibrate(12);menu(+c.dataset.id)},480)});
gd.addEventListener('pointermove',e=>{if(hp&&Math.hypot(e.clientX-hp[0],e.clientY-hp[1])>8)clearTimeout(hold)});
['pointerup','pointercancel','pointerleave'].forEach(t=>gd.addEventListener(t,()=>clearTimeout(hold)));
gd.addEventListener('contextmenu',e=>e.preventDefault());
$('#sheet').onclick=e=>{const b=e.target.closest('[data-m],[data-x]');if(!b)return;if(b.dataset.x){app.classList.remove('mn');doExport(b.dataset.x);return}const n=S.n.find(x=>x.id===hid),m=b.dataset.m;
 if(m==='del'&&!b.dataset.s){b.dataset.s=1;b.lastChild.textContent='Tap again to delete';return}
 if(m==='cov'){app.classList.remove('mn');coverOpen(hid);return}
 if(m==='rst'){delete n.cv;delete n.cvd}
 if(m==='fav')n.fav=n.fav?0:1;
 if(m==='dup'){const c=JSON.parse(JSON.stringify(n));c.id=Date.now();c.title=(n.title||'Untitled')+' copy';c.t=Date.now();S.n.splice(S.n.indexOf(n)+1,0,c)}
